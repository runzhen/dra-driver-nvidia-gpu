# Builds and publishes per-binary tarballs for every release tag pushed by
# .github/workflows/release-automation.yml (tags of the form vX.Y.Z, no -dev).
# Can also be triggered manually for an ad-hoc tag.
name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v0.5.0). Defaults to the workflow ref.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  variables:
    uses: ./.github/workflows/variables.yaml

  build:
    name: Build (${{ matrix.goarch }})
    needs: variables
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            cc: x86_64-linux-gnu-gcc
            cc_pkg: gcc-x86-64-linux-gnu
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cc_pkg: gcc-aarch64-linux-gnu
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${TAG}" || "${TAG}" == "${GITHUB_REF}" ]]; then
            echo "Error: could not resolve a tag to build."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ needs.variables.outputs.golang_version }}

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.cc_pkg }}

      - name: Build binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          OUT="$(pwd)/dist/${TAG}/linux_${GOARCH}"
          mkdir -p "${OUT}"
          make cmds \
            VERSION="${TAG}" \
            GOOS=linux \
            GOARCH="${GOARCH}" \
            CC="${CC}" \
            PREFIX="${OUT}"
          ls -l "${OUT}"

      - name: Package archives
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SRC="dist/${TAG}/linux_${GOARCH}"
          OUT="dist/${TAG}/artifacts"
          mkdir -p "${OUT}"

          # One tar.gz per binary so consumers can grab only what they need.
          for bin in "${SRC}"/*; do
            name="$(basename "${bin}")"
            stage="$(mktemp -d)/${name}-${TAG}-linux-${GOARCH}"
            mkdir -p "${stage}"
            cp "${bin}" "${stage}/${name}"
            cp LICENSE "${stage}/LICENSE"
            tar -C "$(dirname "${stage}")" -czf \
              "${OUT}/${name}-${TAG}-linux-${GOARCH}.tar.gz" \
              "$(basename "${stage}")"
          done

          ( cd "${OUT}" && sha256sum *-linux-${GOARCH}.tar.gz > "SHA256SUMS-linux-${GOARCH}.txt" )
          ls -l "${OUT}"
          echo "dir=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: release-binaries-linux-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.dir }}/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${TAG}" || "${TAG}" == "${GITHUB_REF}" ]]; then
            echo "Error: could not resolve a tag to publish."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Treat pre-release semver (e.g. v1.2.3-rc.1) as a GitHub pre-release.
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-binaries-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          ls -l
          cat SHA256SUMS-linux-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-linux-*.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
